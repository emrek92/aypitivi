name: Playlisti Guncelle

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playlisti uret (Kanal Bazinda Klasorlu & Alternatif Yayinlar)
        run: |
          python generate_playlist.py

      - name: Degisiklik varsa commit et ve pushla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u tivimate_kanallar.m3u
          if ! git diff --staged --quiet; then
            git commit -m "playlist: otomatik guncelleme $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Degisiklik yok, push atlandi."
          fi
